<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LIFELINE AI — AI-powered community incident intelligence and response routing" />
  <meta name="theme-color" content="#0a0f1a" />
  <title>LIFELINE AI — Community Incident Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles/main.css" />
  <meta property="og:title" content="LIFELINE AI" />
  <meta property="og:description" content="AI-powered community incident intelligence and response routing." />
  <meta property="og:image" content="/icons/logo.svg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="LIFELINE AI" />
  <meta name="twitter:description" content="AI-powered community incident intelligence and response routing." />
  <script defer type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  
  <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-header">
      <h1 class="sidebar-title">LIFELINE AI</h1>
      <button class="sidebar-close" id="sidebar-close" aria-label="Close navigation">&times;</button>
    </div>
<nav class="sidebar-nav" role="navigation">
      <button class="sidebar-nav-item active" data-view="emergency" data-nav="emergency">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H7"/></svg>
        <span>Emergency</span>
      </button>
      <button class="sidebar-nav-item" data-view="map" data-nav="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 1 8 6 1 6"/></svg>
        <span>Map</span>
      </button>
    </nav>
    <div class="sidebar-footer" id="sidebar-user-section">
      <div class="sidebar-user" id="sidebar-user" style="display:none;">
        <div class="sidebar-user-info" id="sidebar-user-info">
          <span class="sidebar-user-name" id="sidebar-user-name"></span>
        </div>
        <button class="sidebar-nav-item sidebar-logout" data-action="logout" id="sidebar-logout-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="5" y2="12"/></svg>
          <span>Logout</span>
        </button>
      </div>
      <p class="sidebar-version">LIFELINE AI v1.0.0</p>
    </div>
  </aside>

  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Open navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <div id="app" class="app-container"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <noscript>
    <div style="padding: 40px; text-align: center; background: #0a0f1a; color: #e5e7eb;">
      <h1>LIFELINE AI</h1>
      <p>JavaScript is required to use LIFELINE AI.</p>
      <p>Please enable JavaScript in your browser to continue.</p>
    </div>
  </noscript>
</body>
</html>
